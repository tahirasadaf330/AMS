# AMS — containerised app tiers (replaces the PM2-managed ams-backend + ams-frontend).
# Postgres stays a HOST service (its data + backups are unchanged) — the app reaches it on
# 127.0.0.1 via host networking, exactly as under PM2. Remote source DBs are reached by IP.
#
# Per-VM values come from a compose `.env` next to this file (gitignored):
#   NEXT_PUBLIC_API_URL=http://10.10.9.112:3001      # stage (direct IP)
#   NEXT_PUBLIC_API_URL=https://ams.voipsystem.org/api  # prod (behind nginx)
#
# Usage:  docker compose build && docker compose up -d
name: ams

services:
  backend:
    build:
      context: ./backend
    image: ams-backend:latest
    container_name: ams-backend
    network_mode: host          # 127.0.0.1:5432 host Postgres + binds :3001 for nginx/direct
    restart: unless-stopped
    volumes:
      - ./backend/.env:/app/.env:ro   # ConfigModule loads /app/.env (same file PM2 used)

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:?set NEXT_PUBLIC_API_URL in the compose .env}
    image: ams-frontend:latest
    container_name: ams-frontend
    network_mode: host          # binds :3000
    restart: unless-stopped
    depends_on:
      - backend
