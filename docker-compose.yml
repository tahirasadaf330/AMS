# AMS — containerised app tiers (replaces the PM2-managed ams-backend + ams-frontend).
# Postgres stays a HOST service (its data + backups are unchanged) — the app reaches it on
# 127.0.0.1 via host networking, exactly as under PM2. Remote source DBs are reached by IP.
#
# Per-VM config comes from the existing files on each host — nothing to template:
#   backend/.env        (all secrets/config; mounted read-only into the backend container)
#   frontend/.env.local (NEXT_PUBLIC_* build-time vars; baked into the frontend image at build)
#
# Usage:  docker compose build && docker compose up -d
name: ams

services:
  backend:
    build:
      context: ./backend
    image: ams-backend:latest
    container_name: ams-backend
    network_mode: host          # 127.0.0.1:5432 host Postgres + binds :3001 for nginx/direct
    restart: unless-stopped
    volumes:
      - ./backend/.env:/app/.env:ro   # ConfigModule loads /app/.env (same file PM2 used)
      # requirements.txt is mounted RW so admin-installed Python packages (Settings → Python
      # packages) are persisted back to the host file and survive image rebuilds. Commit it to
      # propagate to other VMs.
      - ./backend/requirements.txt:/app/requirements.txt:rw

  frontend:
    build:
      context: ./frontend        # NEXT_PUBLIC_* are read from frontend/.env.local at build
    image: ams-frontend:latest
    container_name: ams-frontend
    network_mode: host          # binds :3000
    restart: unless-stopped
    depends_on:
      - backend
